<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Voronoi & Delaunay Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="info-panel">
        <p>Stage • <span id="stage">Input definition</span></p>
        <p>Step • <span id="step">1/1</span></p>
        <p id="info">Adjust the point-slider, below. <br>Then, press 'Start' to add input points.</p>
    </div>
    <div id="controls">
        <label for="points-slider">Number of Points: <span id="points-count">8</span></label>
        <input type="range" id="points-slider" min="5" max="100" value="8">
        <button id="start-btn">Start</button>
        <button id="next-btn" disabled>Next Step</button>
        <button id="run-all-btn" disabled>Run All</button>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "three/examples/": "https://unpkg.com/three@0.160.0/examples/",
                "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.9.2/build/index.module.js",
                "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.17/build/index.module.js"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
